services:
  mysql:
    image: mysql:8.0
    container_name: simpleshop-mysql-staging
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: simpleshop
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    volumes:
      - mysql_staging_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/tboulund-devops/devops-exam-project-emilemilhub3:staging
    container_name: simpleshop-api-staging
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: "server=mysql;port=3306;database=simpleshop;user=app;password=app"
    ports:
      - "8001:8080"

volumes:
  mysql_staging_data: