services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  featurehub:
    image: featurehub/party-server:latest
    restart: unless-stopped
    ports:
      - "8085:8085"
    volumes:
      - featurehub_data:/db

  api:
    build:
      context: .
      dockerfile: SimpleShop.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      featurehub:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: "server=mysql;port=3306;database=${MYSQL_DATABASE};user=${MYSQL_USER};password=${MYSQL_PASSWORD}"
      FeatureHub__EdgeUrl: ${FeatureHub__EdgeUrl}
      FeatureHub__ApiKey: ${FeatureHub__ApiKey}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
  featurehub_data: