name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-test-coverage-mutation:
    runs-on: ubuntu-latest

    env:
      CONFIGURATION: Release
      COVERAGE_THRESHOLD: "80"       # <-- sufficient level
      STRYKER_THRESHOLD_BREAK: "60"  # <-- sufficient level
      STRYKER_THRESHOLD_HIGH: "80"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install tools
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          dotnet tool install --global dotnet-stryker
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c $CONFIGURATION --no-restore

      - name: Test with coverage
        run: |
          dotnet test -c $CONFIGURATION --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Generate coverage report (Html + TextSummary)
        if: always()
        run: |
          mkdir -p CoverageReport
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:Html;TextSummary
          cat CoverageReport/Summary.txt

      - name: Enforce coverage threshold
        run: |
          if [ ! -f "CoverageReport/Summary.txt" ]; then
            echo "Coverage summary not found."
            exit 1
          fi

          LINE_COVERAGE=$(grep -i "Line coverage" CoverageReport/Summary.txt | head -n 1 | sed -E 's/.*Line coverage: ([0-9]+).*/\1/')
          echo "Detected line coverage: ${LINE_COVERAGE}%"
          echo "Required line coverage: ${COVERAGE_THRESHOLD}%"

          if [ -z "$LINE_COVERAGE" ]; then
            echo "Could not parse line coverage."
            exit 1
          fi

          if [ "$LINE_COVERAGE" -lt "$COVERAGE_THRESHOLD" ]; then
            echo "Coverage threshold not met."
            exit 1
          fi

      - name: Run mutation tests (Stryker)
        run: |
          mkdir -p StrykerOutput
          dotnet stryker \
            --project "SimpleShop.Api/SimpleShop.Api.csproj" \
            --test-project "SimpleShop.Tests/SimpleShop.Tests.csproj" \
            --reporter "html" \
            --threshold-high ${{ env.STRYKER_THRESHOLD_HIGH }} \
            --threshold-break ${{ env.STRYKER_THRESHOLD_BREAK }} \
            --output "StrykerOutput"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CoverageReport
          if-no-files-found: warn

      - name: Upload stryker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: StrykerOutput
          if-no-files-found: warn