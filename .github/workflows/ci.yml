name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest

    # Global environment variables used throughout the pipeline.
    env:
      CONFIGURATION: Release
      COVERAGE_THRESHOLD: "70"
      MUTATION_HIGH: "80"
      MUTATION_LOW: "50"
      MUTATION_BREAK: "50"

    steps:
      # Checks out the repository so the workflow can access the source code.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installs the required .NET SDK version.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Installs the tools needed for reporting, mutation testing, and SonarQube analysis.
      - name: Install required tools
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          dotnet tool install --global dotnet-stryker
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # Restores all NuGet dependencies.
      - name: Restore
        run: dotnet restore

      # Starts SonarQube analysis.
      # This step is allowed to fail so the rest of the pipeline can still run,
      # but the final enforcement step will fail the job if SonarQube was enabled and did not complete successfully.
      - name: SonarQube - Begin
        id: sonar_begin
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          set +e

          SONAR_HOST_URL="${SONAR_HOST_URL:-http://62.164.217.208:9000}"
          SONAR_PROJECT_KEY="${SONAR_PROJECT_KEY:-SimpleShop}"

          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.coverageReportPaths="CoverageReport/SonarQube.xml" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            /d:sonar.exclusions="CoverageReport/**,StrykerOutput/**,**/Migrations/**,**/wwwroot/**,**/tests/**" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs,**/*DbContext*.cs,**/wwwroot/**,**/FeatureFlags/**,**/tests/**"

          EXIT_CODE=$?
          echo "SONAR_BEGIN_EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "SONAR_ENABLED=1" >> $GITHUB_ENV
          else
            echo "SONAR_ENABLED=0" >> $GITHUB_ENV
          fi

          exit 0

      # Builds the solution in Release mode.
      - name: Build
        run: dotnet build SimpleShop.sln -c $CONFIGURATION --no-restore

      # Runs the test suite and collects code coverage data.
      # The step is allowed to continue so we can still generate reports and upload artifacts.
      - name: Run unit tests (with coverage)
        id: tests
        continue-on-error: true
        run: |
          set +e

          dotnet test SimpleShop.sln -c $CONFIGURATION --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --settings ./coverlet.runsettings

          echo "TEST_EXIT_CODE=$?" >> $GITHUB_ENV
          exit 0

      # Ensures the artifact folders always exist, even if previous steps failed.
      - name: Prepare report folders
        if: always()
        run: |
          mkdir -p CoverageReport
          mkdir -p StrykerOutput

      # Generates HTML, text, and SonarQube-compatible coverage reports.
      - name: Generate coverage report
        if: always()
        continue-on-error: true
        run: |
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:"Html;TextSummary;SonarQube" \
            -filefilters:"-**/Migrations/**;-**/Program.cs;-**/*DbContext*.cs;-**/FeatureFlags/**"

      # Completes SonarQube analysis.
      - name: SonarQube - End
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set +e

          if [ "${SONAR_ENABLED}" = "1" ]; then
            dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
            echo "SONAR_END_EXIT_CODE=$?" >> $GITHUB_ENV
          else
            echo "Skipping SonarQube end because begin failed."
            echo "SONAR_END_EXIT_CODE=1" >> $GITHUB_ENV
          fi

          exit 0

      # Runs mutation testing with Stryker.
      # Output path and reporters are set explicitly to make sure artifacts are generated in a predictable location.
      - name: Run Mutation Tests (Stryker)
        if: always()
        continue-on-error: true
        run: |
          set +e

          rm -rf StrykerOutput
          mkdir -p StrykerOutput

          dotnet stryker \
            --config-file stryker-config.json \
            --output StrykerOutput \
            --reporter html \
            --reporter json \
            --threshold-high "$MUTATION_HIGH" \
            --threshold-low "$MUTATION_LOW" \
            --threshold-break "$MUTATION_BREAK"

          echo "STRYKER_EXIT_CODE=$?" >> $GITHUB_ENV

          echo "---- Raw Stryker files after run ----"
          find StrykerOutput -maxdepth 10 -type f || true

          # Copy the generated HTML report to a predictable location if found.
          HTML_REPORT=$(find StrykerOutput -type f -name "mutation-report.html" | head -n 1)
          if [ -n "$HTML_REPORT" ]; then
            cp "$HTML_REPORT" StrykerOutput/mutation-report.html
          fi

          # Copy the generated JSON report to a predictable location if found.
          JSON_REPORT=$(find StrykerOutput -type f -name "mutation-report.json" | head -n 1)
          if [ -n "$JSON_REPORT" ]; then
            cp "$JSON_REPORT" StrykerOutput/mutation-report.json
          fi

          exit 0

      # Prints generated files for easier debugging if something goes wrong.
      - name: Debug outputs
        if: always()
        run: |
          echo "---- CoverageReport ----"
          find CoverageReport -maxdepth 3 -type f || true
          echo "---- StrykerOutput ----"
          find StrykerOutput -maxdepth 10 -type f || true

      # Uploads coverage artifacts regardless of pipeline success or failure.
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CoverageReport
          if-no-files-found: warn

      # Uploads Stryker artifacts regardless of pipeline success or failure.
      - name: Upload Stryker Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: StrykerOutput
          if-no-files-found: warn

      # Final quality gate.
      # This step is responsible for failing the pipeline when required checks do not meet the defined thresholds.
      - name: Enforce thresholds
        if: always()
        run: |
          FAIL=0

          echo "---- Final quality gate ----"

          # Fail if unit tests failed.
          if [ "${TEST_EXIT_CODE:-1}" -ne 0 ]; then
            echo "Unit tests failed."
            FAIL=1
          fi

          # Fail if SonarQube was enabled but did not complete successfully.
          if [ "${SONAR_ENABLED:-0}" = "1" ] && [ "${SONAR_END_EXIT_CODE:-1}" -ne 0 ]; then
            echo "SonarQube quality gate failed."
            FAIL=1
          fi

          # Fail if coverage summary is missing.
          if [ ! -f "CoverageReport/Summary.txt" ]; then
            echo "Coverage summary missing."
            FAIL=1
          else
            echo "Coverage summary:"
            cat CoverageReport/Summary.txt

            COVERAGE=$(grep "Line coverage" CoverageReport/Summary.txt | sed -E 's/.*: ([0-9]+(\.[0-9]+)?)%.*/\1/' | head -n 1)

            if [ -z "$COVERAGE" ]; then
              echo "Could not extract line coverage percentage."
              FAIL=1
            else
              echo "Line coverage: $COVERAGE%"
              awk "BEGIN { exit !($COVERAGE >= $COVERAGE_THRESHOLD) }" || {
                echo "Code coverage is below the threshold of ${COVERAGE_THRESHOLD}%."
                FAIL=1
              }
            fi
          fi

          # Fail if mutation testing did not complete successfully.
          # Because Stryker uses --threshold-break, a non-zero exit code means the mutation threshold failed
          # or Stryker encountered an error.
          if [ "${STRYKER_EXIT_CODE:-1}" -ne 0 ]; then
            echo "Mutation testing failed or mutation score was below the threshold."
            FAIL=1
          fi

          # Require that at least one Stryker report exists.
          if [ ! -f "StrykerOutput/mutation-report.html" ] && [ ! -f "StrykerOutput/mutation-report.json" ]; then
            echo "Mutation report missing."
            FAIL=1
          fi

          # End the workflow with failure if any quality gate failed.
          if [ "$FAIL" -ne 0 ]; then
            echo "One or more quality checks failed."
            exit 1
          fi

          echo "All quality checks passed."