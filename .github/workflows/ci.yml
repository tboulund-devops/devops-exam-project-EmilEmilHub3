name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest

    env:
      CONFIGURATION: Release
      COVERAGE_THRESHOLD: "70"

    steps:
      # Checkout full git history for analysis tools such as SonarQube.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install the required .NET SDK.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Install global tools used in the pipeline.
      - name: Install required tools
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          dotnet tool install --global dotnet-stryker
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # Restore all dependencies.
      - name: Restore
        run: dotnet restore

      # Start SonarQube analysis.
      # If this step fails, the pipeline continues and skips the end step later.
      - name: SonarQube - Begin
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          set +e

          SONAR_HOST_URL="${SONAR_HOST_URL:-http://62.164.217.208:9000}"
          SONAR_PROJECT_KEY="${SONAR_PROJECT_KEY:-SimpleShop}"

          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.coverageReportPaths="CoverageReport/SonarQube.xml" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            /d:sonar.exclusions="CoverageReport/**,StrykerOutput/**,**/Migrations/**,**/wwwroot/**,**/tests/**" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs,**/*DbContext*.cs,**/wwwroot/**,**/FeatureFlags/**,**/tests/**"

          if [ "$?" -eq 0 ]; then
            echo "SONAR_ENABLED=1" >> $GITHUB_ENV
          else
            echo "SONAR_ENABLED=0" >> $GITHUB_ENV
          fi

          exit 0

      # Build the solution.
      - name: Build
        run: dotnet build -c $CONFIGURATION --no-restore

      # Run tests and collect code coverage.
      - name: Run unit tests
        continue-on-error: true
        run: |
          set +e
          dotnet test SimpleShop.sln -c $CONFIGURATION --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --settings ./coverlet.runsettings
          echo "TEST_EXIT_CODE=$?" >> $GITHUB_ENV
          exit 0

      # Generate coverage reports for SonarQube import, threshold validation, and artifact download.
      - name: Generate coverage report
        if: always()
        continue-on-error: true
        run: |
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:"Html;TextSummary;SonarQube" \
            -filefilters:"-**/Migrations/**;-**/Program.cs;-**/*DbContext*.cs;-**/FeatureFlags/**"

      # Finalize SonarQube analysis if the begin step succeeded.
      - name: SonarQube - End
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set +e
          if [ "${SONAR_ENABLED}" = "1" ]; then
            dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
            echo "SONAR_END_EXIT_CODE=$?" >> $GITHUB_ENV
          else
            echo "SONAR_END_EXIT_CODE=0" >> $GITHUB_ENV
          fi
          exit 0

      # Run mutation testing.
      # Mutation thresholds are enforced by Stryker through stryker-config.json.
      - name: Run mutation tests
        if: always()
        continue-on-error: true
        run: |
          set +e
          dotnet stryker --config-file stryker-config.json
          echo "STRYKER_EXIT_CODE=$?" >> $GITHUB_ENV
          exit 0

      # Upload the generated coverage report so it can be downloaded from GitHub Actions.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CoverageReport
          if-no-files-found: warn

      # Upload the generated Stryker report so it can be downloaded from GitHub Actions.
      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: StrykerOutput
          if-no-files-found: warn

      # Fail the workflow if quality requirements are not met.
      - name: Enforce thresholds
        if: always()
        run: |
          FAIL=0

          if [ "${TEST_EXIT_CODE:-1}" -ne 0 ]; then
            echo "Unit tests failed."
            FAIL=1
          fi

          if [ "${SONAR_ENABLED:-0}" = "1" ] && [ "${SONAR_END_EXIT_CODE:-1}" -ne 0 ]; then
            echo "SonarQube quality gate failed."
            FAIL=1
          fi

          if [ ! -f "CoverageReport/Summary.txt" ]; then
            echo "Coverage summary missing."
            FAIL=1
          else
            COVERAGE=$(grep -oP 'Line coverage:\s+\K[0-9]+(\.[0-9]+)?' CoverageReport/Summary.txt | head -n 1 || echo "0")
            echo "Coverage: $COVERAGE%"
            awk "BEGIN {exit !($COVERAGE >= $COVERAGE_THRESHOLD)}" || FAIL=1
          fi

          if [ "${STRYKER_EXIT_CODE:-1}" -ne 0 ]; then
            echo "Stryker failed or mutation thresholds were not met."
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "Quality checks failed."
            exit 1
          fi