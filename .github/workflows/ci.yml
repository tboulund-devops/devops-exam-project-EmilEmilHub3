name: ci

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest

    env:
      CONFIGURATION: Release
      COVERAGE_THRESHOLD: "70"
      MUTATION_HIGH: "80"
      MUTATION_LOW: "50"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install required tools
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          dotnet tool install --global dotnet-stryker
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c $CONFIGURATION --no-restore

      # ---------------- TEST + COVERAGE ----------------
      - name: Run unit tests (with coverage)
        continue-on-error: true
        run: |
          dotnet test SimpleShop.sln -c $CONFIGURATION --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --settings ./coverlet.runsettings

      - name: Ensure report folders exist
        if: always()
        run: |
          mkdir -p CoverageReport
          mkdir -p StrykerOutput

      - name: Generate coverage report (Html + TextSummary)
        if: always()
        continue-on-error: true
        run: |
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:"Html;TextSummary" \
            -filefilters:"-**/Migrations/**;-**/Program.cs;-**/*DbContext*.cs" || true

          echo "=========== COVERAGE SUMMARY ==========="
          if [ -f "CoverageReport/Summary.txt" ]; then
            cat CoverageReport/Summary.txt
          else
            echo "No Summary.txt found"
          fi
          echo "========================================"

      # ---------------- STRYKER ----------------
      - name: Run Mutation Tests (Stryker)
        if: always()
        continue-on-error: true
        run: |
          dotnet stryker \
            --config-file stryker-config.json \
            --output StrykerOutput \
            --reporters "html,progress" || true

      - name: Debug Stryker output
        if: always()
        run: |
          echo "---- Root ----"
          ls -la
          echo "---- StrykerOutput ----"
          ls -la StrykerOutput || true

      # ---------------- UPLOAD REPORTS ----------------
      - name: Collect Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CoverageReport
          if-no-files-found: warn

      - name: Collect Stryker Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: StrykerOutput
          if-no-files-found: warn

      # ---------------- QUALITY GATE ----------------
      - name: Enforce thresholds (fail job at end)
        if: always()
        run: |
          FAIL=0

          # COVERAGE CHECK
          if [ -f "CoverageReport/Summary.txt" ]; then
            LINE_COVERAGE=$(grep -i "Line coverage" CoverageReport/Summary.txt | head -n 1 | sed -E 's/.*Line coverage: ([0-9]+).*/\1/')
            echo "Detected line coverage: ${LINE_COVERAGE}% (required ${COVERAGE_THRESHOLD}%)"

            if [ -z "$LINE_COVERAGE" ] || [ "$LINE_COVERAGE" -lt "$COVERAGE_THRESHOLD" ]; then
              echo "Coverage threshold not met"
              FAIL=1
            fi
          else
            echo "Coverage summary missing"
            FAIL=1
          fi

          # STRYKER CHECK (kun hvis folder findes)
          if [ -d "StrykerOutput" ] && [ "$(ls -A StrykerOutput)" ]; then
            echo "Stryker output exists"
          else
            echo "Stryker output missing"
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "One or more thresholds failed."
            exit 1
          fi

          echo "All thresholds passed."