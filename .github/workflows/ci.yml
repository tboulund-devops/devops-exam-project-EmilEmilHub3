name: ci

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest

    env:
      CONFIGURATION: Release
      COVERAGE_THRESHOLD: "70"
      MUTATION_HIGH: "80"
      MUTATION_LOW: "50"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install required tools
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          dotnet tool install --global dotnet-stryker
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c $CONFIGURATION --no-restore

      # ---------------- TEST + COVERAGE ----------------
      - name: Run unit tests (with coverage)
        id: tests
        continue-on-error: true
        run: |
          dotnet test SimpleShop.sln -c $CONFIGURATION --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --settings ./coverlet.runsettings

      - name: Prepare report folders
        if: always()
        run: |
          mkdir -p CoverageReport
          mkdir -p StrykerOutput

      - name: Generate coverage report (Html + TextSummary)
        if: always()
        continue-on-error: true
        run: |
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:"Html;TextSummary" \
            -filefilters:"-**/Migrations/**;-**/Program.cs;-**/*DbContext*.cs" || true

          echo "=========== COVERAGE SUMMARY ==========="
          if [ -f "CoverageReport/Summary.txt" ]; then
            cat CoverageReport/Summary.txt
          else
            echo "No Summary.txt found (tests kan være fejlet)."
          fi
          echo "========================================"

      # ---------------- STRYKER ----------------
      - name: Run Mutation Tests (Stryker)
        if: always()
        continue-on-error: true
        run: |
          set +e
          dotnet stryker --config-file stryker-config.json
          echo $? > StrykerOutput/stryker-exitcode.txt

      - name: Ensure Stryker report exists (fallback)
        if: always()
        run: |
          # Hvis Stryker ikke producerede en html rapport, så lav en fallback fil,
          # så artifact altid bliver uploaded og du kan se exit code + fejlårsag.
          if find StrykerOutput -type f -name "*.html" | grep -q .; then
            echo "Stryker HTML report found."
          else
            echo "No Stryker HTML report produced." > StrykerOutput/STRYKER_FAILED.txt
            echo "Exit code (if available):" >> StrykerOutput/STRYKER_FAILED.txt
            cat StrykerOutput/stryker-exitcode.txt 2>/dev/null >> StrykerOutput/STRYKER_FAILED.txt || true
            echo "" >> StrykerOutput/STRYKER_FAILED.txt
            echo "Tip: Check stryker-config.json keys (fx 'ignore-patterns' er ugyldig)." >> StrykerOutput/STRYKER_FAILED.txt
          fi

      - name: Debug Stryker output
        if: always()
        run: |
          echo "---- Root ----"
          ls -la
          echo "---- StrykerOutput ----"
          find StrykerOutput -maxdepth 6 -type f -print || true

      # ---------------- UPLOAD REPORTS ----------------
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CoverageReport
          if-no-files-found: warn

      - name: Upload Stryker Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: StrykerOutput
          if-no-files-found: warn

      # ---------------- QUALITY GATE (fail at end) ----------------
      - name: Enforce thresholds (fail job at end)
        if: always()
        run: |
          FAIL=0

          # COVERAGE CHECK
          if [ -f "CoverageReport/Summary.txt" ]; then
            LINE_COVERAGE=$(grep -i "Line coverage" CoverageReport/Summary.txt | head -n 1 | sed -E 's/.*Line coverage: ([0-9]+).*/\1/')
            echo "Detected line coverage: ${LINE_COVERAGE}% (required ${COVERAGE_THRESHOLD}%)"

            if [ -z "$LINE_COVERAGE" ] || [ "$LINE_COVERAGE" -lt "$COVERAGE_THRESHOLD" ]; then
              echo "Coverage threshold not met -> FAIL"
              FAIL=1
            fi
          else
            echo "Coverage summary missing -> FAIL"
            FAIL=1
          fi

          # STRYKER CHECK (thresholds håndteres af Stryker selv via config)
          STRYKER_EXIT=1
          if [ -f "StrykerOutput/stryker-exitcode.txt" ]; then
            STRYKER_EXIT=$(cat StrykerOutput/stryker-exitcode.txt)
          fi
          echo "Stryker exit code: $STRYKER_EXIT"

          if [ "$STRYKER_EXIT" -ne 0 ]; then
            echo "Stryker thresholds not met or Stryker failed -> FAIL"
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "One or more thresholds failed."
            exit 1
          fi

          echo "All thresholds passed."