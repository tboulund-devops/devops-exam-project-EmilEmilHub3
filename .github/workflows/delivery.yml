name: Delivery Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  delivery:
    runs-on: ubuntu-latest
    outputs:
      staging_url: ${{ steps.staging_url.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set lowercase image name
        id: repo
        run: echo "image_name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set staging URL
        id: staging_url
        run: echo "url=${{ vars.STAGING_BASE_URL }}" >> $GITHUB_OUTPUT

      - name: Calculate semantic version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: ""
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: "feat:"
          version_format: "${major}.${minor}.${patch}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.repo.outputs.image_name }}:staging \
            -t ${{ steps.repo.outputs.image_name }}:latest \
            -t ${{ steps.repo.outputs.image_name }}:${{ steps.semver.outputs.version }} \
            -f SimpleShop.Api/Dockerfile \
            .

      - name: Push Docker images
        run: |
          docker push ${{ steps.repo.outputs.image_name }}:staging
          docker push ${{ steps.repo.outputs.image_name }}:latest
          docker push ${{ steps.repo.outputs.image_name }}:${{ steps.semver.outputs.version }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.semver.outputs.version }}
          generateReleaseNotes: true
          allowUpdates: true

      - name: Copy staging compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "docker-compose.staging.yml"
          target: "simpleshop"

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            mkdir -p ~/simpleshop
            cd ~/simpleshop
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose -f docker-compose.staging.yml --env-file .env pull
            docker compose -f docker-compose.staging.yml --env-file .env up -d

  e2e-staging:
    name: Run E2E tests against staging
    runs-on: ubuntu-latest
    needs: delivery

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install npm packages
        run: npm install

      - name: Wait for staging to become ready
        run: |
          for i in {1..30}; do
            if curl -fsS "${{ needs.delivery.outputs.staging_url }}/api/products" > /dev/null; then
              echo "Staging is ready"
              exit 0
            fi
            sleep 10
          done

          echo "Staging did not become ready in time"
          exit 1

      - name: Run TestCafe E2E on staging
        env:
          CHROME_BIN: /usr/bin/google-chrome
          BASE_URL: ${{ needs.delivery.outputs.staging_url }}
        run: npx testcafe chrome:headless tests/e2e/*.js

  performance-staging:
    name: Run K6 performance test against staging
    runs-on: ubuntu-latest
    needs: delivery

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg ca-certificates
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Wait for staging to become ready
        run: |
          for i in {1..30}; do
            if curl -fsS "${{ needs.delivery.outputs.staging_url }}/api/products" > /dev/null; then
              echo "Staging is ready"
              exit 0
            fi
            sleep 10
          done

          echo "Staging did not become ready in time"
          exit 1

      - name: Run K6 on staging
        env:
          BASE_URL: ${{ needs.delivery.outputs.staging_url }}
        run: k6 run tests/performance/products-smoke.js

  deployment:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs:
      - delivery
      - e2e-staging
      - performance-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: "docker-compose.production.yml"
          target: "simpleshop"

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            mkdir -p ~/simpleshop
            cd ~/simpleshop
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose -f docker-compose.production.yml --env-file .env pull
            docker compose -f docker-compose.production.yml --env-file .env up -d