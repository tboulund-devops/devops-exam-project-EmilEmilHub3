```yaml
name: Delivery Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:

  delivery:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set lowercase repository name
        id: repo
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Calculate semantic version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: ""
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: "feat:"
          version_format: "${major}.${minor}.${patch}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ steps.repo.outputs.repo }}:staging \
            -t ghcr.io/${{ steps.repo.outputs.repo }}:latest \
            -t ghcr.io/${{ steps.repo.outputs.repo }}:${{ steps.semver.outputs.version }} \
            -f SimpleShop.Api/Dockerfile \
            .

      - name: Push Docker images
        run: |
          docker push ghcr.io/${{ steps.repo.outputs.repo }}:staging
          docker push ghcr.io/${{ steps.repo.outputs.repo }}:latest
          docker push ghcr.io/${{ steps.repo.outputs.repo }}:${{ steps.semver.outputs.version }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.semver.outputs.version }}
          generateReleaseNotes: true
          allowUpdates: true
          body: |
            Container image:
            ghcr.io/${{ steps.repo.outputs.repo }}:${{ steps.semver.outputs.version }}

      # ---------------- STAGING DEPLOY ----------------

      - name: Copy staging compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "docker-compose.staging.yml"
          target: simpleshop/

      - name: Deploy to staging
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd simpleshop
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d

  deployment:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: delivery

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: "docker-compose.production.yml"
          target: simpleshop/

      - name: Deploy to production
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd simpleshop
            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml up -d
```
