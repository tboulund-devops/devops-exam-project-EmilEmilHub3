name: Delivery Pipeline

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  Delivery:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore .NET dependencies
        run: dotnet restore SimpleShop.Api/SimpleShop.Api.csproj -r linux-x64

      - name: Create EF migration bundle
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

          mkdir -p artifacts

          dotnet ef migrations bundle \
            --project SimpleShop.Api/SimpleShop.Api.csproj \
            --startup-project SimpleShop.Api/SimpleShop.Api.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained \
            --output artifacts/efbundle

      - name: Set image name
        id: repo
        run: echo "image_name=ghcr.io/tboulund-devops/devops-exam-project-emilemilhub3" >> $GITHUB_OUTPUT

      - name: Calculate semantic version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: ""
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: "feat:"
          version_format: "${major}.${minor}.${patch}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.repo.outputs.image_name }}:staging \
            -t ${{ steps.repo.outputs.image_name }}:latest \
            -t ${{ steps.repo.outputs.image_name }}:${{ steps.semver.outputs.version }} \
            -f SimpleShop.Api/Dockerfile \
            .

      - name: Push Docker images
        run: |
          docker push ${{ steps.repo.outputs.image_name }}:staging
          docker push ${{ steps.repo.outputs.image_name }}:latest
          docker push ${{ steps.repo.outputs.image_name }}:${{ steps.semver.outputs.version }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.semver.outputs.version }}
          generateReleaseNotes: true
          allowUpdates: true

      - name: Copy staging compose file and EF bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "docker-compose.staging.yml,artifacts/efbundle"
          target: "simpleshop"

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e

            mkdir -p ~/simpleshop
            cd ~/simpleshop

            chmod +x artifacts/efbundle

            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            docker compose -f docker-compose.staging.yml --env-file .env up -d mysql

            for i in {1..30}; do
              if docker compose -f docker-compose.staging.yml --env-file .env ps mysql | grep -q "healthy"; then
                echo "MySQL is healthy"
                break
              fi

              echo "Waiting for MySQL to become healthy..."
              sleep 5
            done

            MYSQL_DATABASE=$(grep '^MYSQL_DATABASE=' .env | cut -d= -f2-)
            MYSQL_ROOT_PASSWORD=$(grep '^MYSQL_ROOT_PASSWORD=' .env | cut -d= -f2-)

            CONNECTION_STRING="server=mysql;port=3306;database=${MYSQL_DATABASE};user=root;password=${MYSQL_ROOT_PASSWORD}"

            docker run --rm \
              --network simpleshop_default \
              -e CONNECTION_STRING="$CONNECTION_STRING" \
              -v "$PWD:/work" \
              -w /work \
              mcr.microsoft.com/dotnet/runtime-deps:8.0 \
              ./artifacts/efbundle \
              --connection "$CONNECTION_STRING"

            docker compose -f docker-compose.staging.yml --env-file .env pull api
            docker compose -f docker-compose.staging.yml --env-file .env up -d api

  e2e-staging:
    name: Run E2E tests against staging
    runs-on: ubuntu-latest
    needs: Delivery
    env:
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install npm packages
        run: npm install

      - name: Print staging URL
        run: echo "STAGING_BASE_URL=$STAGING_BASE_URL"

      - name: Wait for staging to become ready
        run: |
          echo "Checking $STAGING_BASE_URL/api/products"

          sleep 20

          for i in {1..60}; do
            if curl -fsS "$STAGING_BASE_URL/api/products" > /dev/null; then
              echo "Staging is ready"
              exit 0
            fi

            echo "Attempt $i failed, waiting 5 seconds..."
            sleep 5
          done

          echo "Staging did not become ready in time"
          exit 1

      - name: Run TestCafe E2E on staging
        env:
          CHROME_BIN: /usr/bin/google-chrome
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: npx testcafe chrome:headless tests/e2e/*.js

  performance-staging:
    name: Run K6 performance test against staging
    runs-on: ubuntu-latest
    needs: Delivery
    env:
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg ca-certificates
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Print staging URL
        run: echo "STAGING_BASE_URL=$STAGING_BASE_URL"

      - name: Wait for staging to become ready
        run: |
          echo "Checking $STAGING_BASE_URL/api/products"

          sleep 20

          for i in {1..60}; do
            if curl -fsS "$STAGING_BASE_URL/api/products" > /dev/null; then
              echo "Staging is ready"
              exit 0
            fi

            echo "Attempt $i failed, waiting 5 seconds..."
            sleep 5
          done

          echo "Staging did not become ready in time"
          exit 1

      - name: Run K6 on staging
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: k6 run tests/performance/products-load.js

  deployment:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs:
      - Delivery
      - e2e-staging
      - performance-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore .NET dependencies
        run: dotnet restore SimpleShop.Api/SimpleShop.Api.csproj -r linux-x64

      - name: Create EF migration bundle
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

          mkdir -p artifacts

          dotnet ef migrations bundle \
            --project SimpleShop.Api/SimpleShop.Api.csproj \
            --startup-project SimpleShop.Api/SimpleShop.Api.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained \
            --output artifacts/efbundle

      - name: Copy production compose file and EF bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: "docker-compose.production.yml,artifacts/efbundle"
          target: "simpleshop"

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e

            mkdir -p ~/simpleshop
            cd ~/simpleshop

            chmod +x artifacts/efbundle

            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            docker compose -f docker-compose.production.yml --env-file .env up -d mysql

            for i in {1..30}; do
              if docker compose -f docker-compose.production.yml --env-file .env ps mysql | grep -q "healthy"; then
                echo "MySQL is healthy"
                break
              fi

              echo "Waiting for MySQL to become healthy..."
              sleep 5
            done

            MYSQL_DATABASE=$(grep '^MYSQL_DATABASE=' .env | cut -d= -f2-)
            MYSQL_ROOT_PASSWORD=$(grep '^MYSQL_ROOT_PASSWORD=' .env | cut -d= -f2-)

            CONNECTION_STRING="server=mysql;port=3306;database=${MYSQL_DATABASE};user=root;password=${MYSQL_ROOT_PASSWORD}"

            docker run --rm \
              --network simpleshop_default \
              -e CONNECTION_STRING="$CONNECTION_STRING" \
              -v "$PWD:/work" \
              -w /work \
              mcr.microsoft.com/dotnet/runtime-deps:8.0 \
              ./artifacts/efbundle \
              --connection "$CONNECTION_STRING"

            docker compose -f docker-compose.production.yml --env-file .env pull api
            docker compose -f docker-compose.production.yml --env-file .env up -d api
